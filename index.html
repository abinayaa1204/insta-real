<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta - My Social World</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5eee5;color:#4b3528;font-family:Arial,sans-serif}
.hidden{display:none!important}
button{cursor:pointer}
.logo{font-family:Georgia,serif;font-size:35px;color:#68452f}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#e4cfb9,#fffaf2)}
.auth-card{width:100%;max-width:390px;background:#fffaf3;padding:35px;border-radius:18px;text-align:center;box-shadow:0 10px 35px #65452b20}
.tagline{color:#9b8069;margin:10px 0 25px}
.auth-tabs{display:flex;gap:10px;margin-bottom:22px}
.auth-tabs button{flex:1;padding:12px;border:0;border-radius:8px;background:#eadbca;color:#65452f}
.auth-tabs button.active{background:#75513a;color:white}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddc9b3;border-radius:8px;background:#fffdf9;color:#493528;outline:none}
.primary-btn{background:#75513a;color:white;border:0;padding:11px 18px;border-radius:8px}
.auth-card .primary-btn{width:100%;margin-top:15px}
.auth-note{margin-top:15px;font-size:12px;color:#987c64}
.navbar{background:#fffaf3;border-bottom:1px solid #e4d4c3;padding:13px 7%;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:10}
.search{max-width:300px;margin:0;background:#f1e7dc}
.nav-actions{display:flex;gap:17px}
.nav-actions button{border:0;background:transparent;color:#65452f;font-size:24px}
.main-container{max-width:1000px;margin:35px auto;padding:15px}
.page-heading{font-family:Georgia,serif;font-size:28px}
.subheading{color:#9a7e67;margin:8px 0 25px}
.feed-grid,.post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.post-card{background:#fffaf3;border-radius:12px;overflow:hidden;border:1px solid #e6d8c8}
.post-info{padding:12px}
.post-user{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.post-user img{width:35px;height:35px;border-radius:50%}
.post-user strong{cursor:pointer}
.post-caption{font-size:13px;color:#826a55;margin:8px 0}
.like-btn{border:0;background:transparent;color:#79533b;cursor:pointer;font-size:15px;margin-right:8px}
.profile-header{display:flex;gap:55px;align-items:center;padding:25px 35px;flex-wrap:wrap}
.profile-avatar{width:145px;height:145px;border-radius:50%;border:5px solid #c4a17d;background:#e9d9c6}
.profile-details{flex:1}
.profile-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.profile-top h2{font-weight:normal}
.stats{display:flex;gap:40px;margin:23px 0}
.stats div{display:flex;flex-direction:column;gap:5px;cursor:pointer}
.stats strong{font-size:20px}
.stats span{color:#987b62;font-size:13px}
#profileBio{margin-top:8px;color:#806851}
.profile-toolbar{margin-top:35px;border-top:1px solid #dfcbb6;padding:20px;display:flex;justify-content:space-between;align-items:center;letter-spacing:2px}
.profile-toolbar button{border:0;background:#75513a;color:white;padding:9px 14px;border-radius:7px}
.profile-post{cursor:pointer;overflow:hidden;aspect-ratio:1;border-radius:8px}
.profile-post img{width:100%;height:100%;object-fit:cover}
.modal{display:none;position:fixed;inset:0;background:#24170fcc;z-index:30;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-card{position:relative;width:100%;max-width:450px;max-height:85vh;overflow-y:auto;padding:28px;background:#fffaf3;border-radius:15px}
.modal-card h2{margin-bottom:20px}
.close-btn{position:absolute;right:17px;top:12px;font-size:27px;border:0;background:none;color:#65452f}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eadbca}
.person img{width:45px;height:45px;border-radius:50%;cursor:pointer}
.person-info{flex:1;cursor:pointer}
.person-info small{display:block;margin-top:4px;color:#9a806a}
.person button{border:0;padding:8px 12px;border-radius:7px;background:#75513a;color:white}
.post-modal-card{max-width:520px}
.post-modal-card img{width:100%;border-radius:10px;max-height:60vh;object-fit:contain}
.upload-area{margin-top:15px}
.upload-area textarea{resize:vertical;min-height:90px}
.upload-area .primary-btn{width:100%;margin-top:12px}
.search-results{background:#fffaf3;padding:15px;border-radius:10px;margin-bottom:20px}
.people-page{background:#fffaf3;border:1px solid #e6d8c8;border-radius:14px;padding:24px;max-width:720px;margin:0 auto}
.people-page-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.back-btn{border:0;background:#eadbca;color:#65452f;padding:9px 14px;border-radius:8px}
.person button:disabled{opacity:.65;cursor:default}
.post-card>img{cursor:pointer}
.post-user img,.post-user strong{cursor:pointer}

@media(max-width:650px){
.navbar{padding:12px;flex-wrap:wrap}
.navbar .logo{font-size:27px}
.search{order:3;max-width:100%}
.nav-actions{gap:12px}
.profile-header{gap:20px;padding:15px}
.profile-avatar{width:90px;height:90px}
.stats{gap:20px}
.feed-grid,.post-grid{gap:6px}
.post-info{padding:7px}
}
</style>
</head>

<body>

<section id="authPage" class="auth-page">
<div class="auth-card">
<h1 class="logo">insta.</h1>
<p class="tagline">Share your little world 🤎</p>

<div class="auth-tabs">
<button id="loginTab" class="active" onclick="switchAuth('login')">Login</button>
<button id="signupTab" onclick="switchAuth('signup')">Sign Up</button>
</div>

<form id="loginForm">
<input id="loginUsername" placeholder="Username" required>
<input id="loginPassword" type="password" placeholder="Password" required>
<button class="primary-btn">Login</button>
<p class="auth-note">Demo: abhi / 1234</p>
</form>

<form id="signupForm" class="hidden">
<input id="signupName" placeholder="Full Name" required>
<input id="signupUsername" placeholder="Username" required>
<input id="signupEmail" type="email" placeholder="Email" required>
<input id="signupPassword" type="password" minlength="4" placeholder="Password" required>
<button class="primary-btn">Create Account</button>
</form>
</div>
</section>

<div id="app" class="hidden">

<header class="navbar">
<h1 class="logo">insta.</h1>

<input id="searchInput" class="search" placeholder="Search people..." oninput="searchUsers()">

<div class="nav-actions">
<button onclick="showFeed()">⌂</button>
<button onclick="openUpload()">＋</button>
<button onclick="showMyProfile()">👤</button>
<button onclick="logout()">↪</button>
</div>
</header>

<main class="main-container">

<div id="searchResults" class="search-results hidden"></div>

<section id="feedPage">
<h2 class="page-heading">Explore your world ✨</h2>
<p class="subheading">Little moments, beautiful memories.</p>
<div id="feedPosts" class="feed-grid"></div>
</section>

<section id="profilePage" class="hidden">

<div class="profile-header">
<img id="profileAvatar" class="profile-avatar" alt="Cartoon avatar">

<div class="profile-details">

<div class="profile-top">
<h2 id="profileUsername"></h2>
<button id="profileAction" class="primary-btn" onclick="handleProfileAction()"></button>
</div>

<div class="stats">
<div>
<strong id="postCount">0</strong>
<span>Posts</span>
</div>

<div onclick="openPeople('followers')">
<strong id="followersCount">0</strong>
<span>Followers</span>
</div>

<div onclick="openPeople('following')">
<strong id="followingCount">0</strong>
<span>Following</span>
</div>
</div>

<h3 id="profileName"></h3>
<p id="profileBio"></p>

</div>
</div>

<div class="profile-toolbar">
<button class="back-btn" onclick="showFeed()">← Home</button>
<span>▦ POSTS</span>
<button id="addPostButton" onclick="openUpload()">＋ Add Post</button>
</div>

<div id="profilePosts" class="post-grid"></div>
</section>

<section id="peoplePage" class="hidden">
<div class="people-page">

<div class="people-page-head">
<button class="back-btn" onclick="backFromPeople()">← Back</button>

<div>
<h2 id="peoplePageHeading" class="page-heading">Followers</h2>
<p id="peoplePageSubheading" class="subheading" style="margin:5px 0 0">People</p>
</div>
</div>

<div id="peoplePageList"></div>
</div>
</section>

</main>
</div>

<div id="postModal" class="modal">
<div class="modal-card post-modal-card">
<button class="close-btn" onclick="closeModal('postModal')">×</button>
<div id="postViewContent"></div>
</div>
</div>

<div id="uploadModal" class="modal">
<div class="modal-card">
<button class="close-btn" onclick="closeModal('uploadModal')">×</button>

<h2>Create a post 🤎</h2>

<div class="upload-area">
<p>Choose your picture (Maximum 5 MB)</p>
<input type="file" id="postImage" accept="image/*">
<textarea id="postCaption" placeholder="Write a caption..."></textarea>
<button class="primary-btn" onclick="uploadPost()">Share Post</button>
</div>
</div>
</div>

<script>

const $ = id => document.getElementById(id);

const authPage=$("authPage"), app=$("app"), loginForm=$("loginForm"), signupForm=$("signupForm");
const loginTab=$("loginTab"), signupTab=$("signupTab"), loginUsername=$("loginUsername"), loginPassword=$("loginPassword");
const signupName=$("signupName"), signupUsername=$("signupUsername"), signupEmail=$("signupEmail"), signupPassword=$("signupPassword");

const searchInput=$("searchInput"), searchResults=$("searchResults"), feedPage=$("feedPage"), profilePage=$("profilePage"), peoplePage=$("peoplePage");

const feedPosts=$("feedPosts"), profileAvatar=$("profileAvatar"), profileUsername=$("profileUsername"), profileName=$("profileName");

const profileBio=$("profileBio"), postCount=$("postCount"), followersCount=$("followersCount"), followingCount=$("followingCount");

const profileActionBtn=$("profileAction"), addPostButton=$("addPostButton"), profilePosts=$("profilePosts");

const peoplePageHeading=$("peoplePageHeading"), peoplePageSubheading=$("peoplePageSubheading"), peoplePageList=$("peoplePageList");

const postViewContent=$("postViewContent"), postModal=$("postModal"), uploadModal=$("uploadModal");

const postImage=$("postImage"), postCaption=$("postCaption");

const KEY="insta_social_v2";

const avatar=s=>"https://api.dicebear.com/9.x/adventurer/svg?seed="+encodeURIComponent(s);

// PHOTO POSTS
const arts=[
["https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900","Flowers make everything beautiful 🌷"],
["https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900","A little peace of mind 🦋"],
["https://images.unsplash.com/photo-1519681393784-d120267933ba?w=900","Dreaming under the moon 🌙"],
["https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=900","Coffee and quiet mornings ☕"],
["https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=900","Collecting little moments 🎀"],
["https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=900","Choose happiness 🌻"],
["https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900","Soft days and warm thoughts 🧸"],
["https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=900","Bloom at your own pace 🌸"],
["https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900","A little sparkle ✨"],
["https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900","Autumn memories 🍂"]
];

function initialData(){

const users=[
{id:"u1",name:"Abhi",username:"abhi",password:"1234",email:"abhi@example.com",bio:"Little moments, big memories ✨",avatar:avatar("Abhi"),followers:["u2","u3","u4"],following:["u2","u3"]},
{id:"u2",name:"Anu",username:"anu",password:"1234",email:"anu@example.com",bio:"Dreamer and flower lover 🌷",avatar:avatar("Anu"),followers:["u1"],following:["u1","u3"]},
{id:"u3",name:"Priya",username:"priya",password:"1234",email:"priya@example.com",bio:"Creating my own sunshine ☀️",avatar:avatar("Priya"),followers:["u1","u2"],following:["u1"]},
{id:"u4",name:"Kavi",username:"kavi",password:"1234",email:"kavi@example.com",bio:"Art, music and happiness 🎀",avatar:avatar("Kavi"),followers:["u1"],following:[]},
{id:"u5",name:"Maya",username:"maya",password:"1234",email:"maya@example.com",bio:"Living in little moments 🌙",avatar:avatar("Maya"),followers:[],following:[]},
{id:"u6",name:"Sara",username:"sara",password:"1234",email:"sara@example.com",bio:"Just be yourself 🦋",avatar:avatar("Sara"),followers:[],following:["u2"]}
];

const posts=[];

users.slice(0,4).forEach((u,i)=>{
for(let j=0;j<(i===0?10:3);j++){
const a=arts[(i+j)%arts.length];
posts.push({
id:"p"+i+"_"+j,
userId:u.id,
image:a[0],
caption:a[1],
likes:12+j*4,
likedBy:[]
});
}
});

return {users,posts};
}

let data;

try{
data=JSON.parse(localStorage.getItem(KEY));
}catch(e){
data=null;
}

if(!data||!Array.isArray(data.users)||!Array.isArray(data.posts)){
data=initialData();
saveData();
}

// Convert old emoji posts into photo posts
data.posts.forEach((p,i)=>{
if(!p.image){
const photo=arts[i%arts.length];
p.image=photo[0];
if(!p.caption || p.caption===p.emoji) p.caption=photo[1];
delete p.emoji;
delete p.cls;
}
});

saveData();

let currentUserId=null,viewedUserId=null;

function saveData(){
try{
localStorage.setItem(KEY,JSON.stringify(data));
return true;
}catch(e){
alert("Browser storage is full. Please remove an old uploaded post or choose a smaller image.");
return false;
}
}

function getUser(id){
return data.users.find(u=>u.id===id);
}

function me(){
return getUser(currentUserId);
}

function userPosts(id){
return data.posts.filter(p=>p.userId===id);
}

function safe(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// AUTH

function switchAuth(type){
loginForm.classList.toggle("hidden",type!=="login");
signupForm.classList.toggle("hidden",type!=="signup");
loginTab.classList.toggle("active",type==="login");
signupTab.classList.toggle("active",type==="signup");
}

loginForm.onsubmit=e=>{
e.preventDefault();

const u=data.users.find(x=>
x.username===loginUsername.value.trim().toLowerCase() &&
x.password===loginPassword.value
);

if(!u)return alert("Incorrect username or password!");

loginUser(u.id);
};

signupForm.onsubmit=e=>{
e.preventDefault();

const name=signupName.value.trim();
const username=signupUsername.value.trim().toLowerCase();
const email=signupEmail.value.trim().toLowerCase();
const password=signupPassword.value;

if(!/^[a-z0-9_]{3,20}$/.test(username))
return alert("Username must be 3-20 letters, numbers or underscores.");

if(data.users.some(u=>u.username===username||u.email===email))
return alert("Username or email already exists!");

const u={
id:"u"+Date.now(),
name,
username,
email,
password,
bio:"Welcome to my little world 🤎",
avatar:avatar(username),
followers:[],
following:[]
};

data.users.push(u);
saveData();
loginUser(u.id);
alert("Account created successfully!");
};

function loginUser(id){
currentUserId=id;
localStorage.setItem("insta_logged_user",id);
authPage.classList.add("hidden");
app.classList.remove("hidden");
showFeed();
}

function logout(){
currentUserId=null;
localStorage.removeItem("insta_logged_user");
app.classList.add("hidden");
authPage.classList.remove("hidden");
searchInput.value="";
searchResults.classList.add("hidden");
}

// NAVIGATION

function showFeed(){
feedPage.classList.remove("hidden");
profilePage.classList.add("hidden");
peoplePage.classList.add("hidden");
searchResults.classList.add("hidden");
renderFeed();
}

function showMyProfile(){
openProfile(currentUserId);
}

// FEED

function renderFeed(){

feedPosts.innerHTML="";

[...data.posts].reverse().forEach(p=>{

const u=getUser(p.userId);
if(!u)return;

const card=document.createElement("article");
card.className="post-card";

const visual=`<img src="${safe(p.image)}" alt="Post photo" style="width:100%;height:220px;object-fit:cover">`;

card.innerHTML=`
${visual}
<div class="post-info">
<div class="post-user">
<img src="${safe(u.avatar)}" alt="">
<strong>${safe(u.username)}</strong>
</div>

<p class="post-caption">${safe(p.caption)}</p>

<button class="like-btn">
${p.likedBy.includes(currentUserId)?"♥":"♡"} ${p.likes} Likes
</button>

<button class="like-btn">View post ↗</button>
</div>
`;

card.querySelector(".post-user strong").onclick=()=>openProfile(u.id);
card.querySelector(".post-user img").onclick=()=>openProfile(u.id);

card.querySelectorAll(".like-btn")[0].onclick=()=>toggleLike(p.id);
card.querySelectorAll(".like-btn")[1].onclick=()=>openPost(p.id);

card.querySelector(":scope > img")?.addEventListener("click",()=>openPost(p.id));

feedPosts.appendChild(card);

});
}

// PROFILE

function openProfile(id){

const u=getUser(id);
if(!u)return;

viewedUserId=id;

feedPage.classList.add("hidden");
profilePage.classList.remove("hidden");
peoplePage.classList.add("hidden");
searchResults.classList.add("hidden");

profileAvatar.src=u.avatar;
profileUsername.textContent=u.username;
profileName.textContent=u.name;
profileBio.textContent=u.bio;

postCount.textContent=userPosts(id).length;
followersCount.textContent=u.followers.length;
followingCount.textContent=u.following.length;

const own=id===currentUserId;

profileActionBtn.style.display=own?"none":"inline-block";

profileActionBtn.textContent=
me().following.includes(id)?"Following":"Follow";

addPostButton.style.display=own?"inline-block":"none";

renderProfilePosts(id);
}

function renderProfilePosts(id){

profilePosts.innerHTML="";

const posts=userPosts(id);

posts.forEach(p=>{

const div=document.createElement("div");
div.className="profile-post";

const img=document.createElement("img");
img.src=p.image;
img.alt=p.caption||"Post photo";

div.appendChild(img);
div.onclick=()=>openPost(p.id);

profilePosts.appendChild(div);

});

if(!posts.length)
profilePosts.textContent="No posts yet 🤎";

}

// FOLLOW / UNFOLLOW

function toggleFollow(id){

const target=getUser(id);
const user=me();

if(!target||!user||id===currentUserId)return;

if(user.following.includes(id)){

user.following=user.following.filter(x=>x!==id);
target.followers=target.followers.filter(x=>x!==currentUserId);

}else{

user.following.push(id);

if(!target.followers.includes(currentUserId))
target.followers.push(currentUserId);

}

saveData();
}

function handleProfileAction(){
toggleFollow(viewedUserId);
openProfile(viewedUserId);
}

// FOLLOWERS / FOLLOWING

let peopleReturnUserId=null;
let currentPeopleType="followers";

function openPeople(type){

const u=getUser(viewedUserId);
if(!u)return;

peopleReturnUserId=viewedUserId;
currentPeopleType=type;

feedPage.classList.add("hidden");
profilePage.classList.add("hidden");
peoplePage.classList.remove("hidden");
searchResults.classList.add("hidden");

peoplePageHeading.textContent=
type==="followers"?"Followers":"Following";

peoplePageSubheading.textContent=
"@"+u.username+" · "+
(type==="followers"?u.followers.length:u.following.length)+" people";

renderPeoplePage();
}

function renderPeoplePage(){

const u=getUser(peopleReturnUserId);
if(!u)return;

const ids=currentPeopleType==="followers"?u.followers:u.following;

peoplePageList.innerHTML="";

if(!ids.length){
peoplePageList.innerHTML=
'<p style="padding:20px;color:#987b62">No '+currentPeopleType+' yet 🤎</p>';
return;
}

ids.forEach(id=>{

const person=getUser(id);
if(!person)return;

const row=document.createElement("div");
row.className="person";

const img=document.createElement("img");
img.src=person.avatar;
img.alt=person.username;

const info=document.createElement("div");
info.className="person-info";

info.innerHTML=`
<b>${safe(person.username)}</b>
<small>${safe(person.name)}</small>
`;

const btn=document.createElement("button");

const isMe=id===currentUserId;

btn.textContent=
isMe?"You":me().following.includes(id)?"Following":"Follow";

btn.disabled=isMe;

btn.onclick=()=>{
toggleFollow(id);
openProfile(peopleReturnUserId);
openPeople(currentPeopleType);
};

img.onclick=info.onclick=()=>openProfile(id);

row.append(img,info,btn);
peoplePageList.appendChild(row);

});

}

function backFromPeople(){
openProfile(peopleReturnUserId);
}

// POSTS AND LIKES

function openPost(id){

const p=data.posts.find(x=>x.id===id);
if(!p)return;

const u=getUser(p.userId);

const visual=`<img src="${safe(p.image)}" alt="Post photo">`;

postViewContent.innerHTML=`
<div class="post-user">
<img src="${safe(u.avatar)}">
<strong id="postOwner">${safe(u.username)}</strong>
</div>

${visual}

<p style="margin:15px 0">${safe(p.caption)}</p>

<button class="primary-btn" id="likePost">
${p.likedBy.includes(currentUserId)?"♥ Liked":"♡ Like"}
</button>

<p style="margin-top:12px">${p.likes} Likes</p>
`;

$("postOwner").onclick=()=>{
closeModal("postModal");
openProfile(u.id);
};

$("likePost").onclick=()=>{
toggleLike(id);
openPost(id);
};

postModal.classList.add("show");

}

function toggleLike(id){

const p=data.posts.find(x=>x.id===id);
if(!p)return;

if(p.likedBy.includes(currentUserId)){

p.likedBy=p.likedBy.filter(x=>x!==currentUserId);
p.likes=Math.max(0,p.likes-1);

}else{

p.likedBy.push(currentUserId);
p.likes++;

}

saveData();

if(!feedPage.classList.contains("hidden"))
renderFeed();

if(!profilePage.classList.contains("hidden"))
renderProfilePosts(viewedUserId);

}

// IMAGE UPLOAD - 5 MB LIMIT

function openUpload(){

postImage.value="";
postCaption.value="";
uploadModal.classList.add("show");

}

// Maximum upload size: 5 MB
const MAX_UPLOAD_SIZE = 5 * 1024 * 1024;

// Compress image to reduce browser storage usage
const MAX_SAVED_IMAGE_SIZE = 600 * 1024;

function compressImage(file){

return new Promise((resolve,reject)=>{

const image=new Image();
const objectUrl=URL.createObjectURL(file);

image.onload=async()=>{

try{

let width=image.naturalWidth;
let height=image.naturalHeight;

let scale=Math.min(1,1200/Math.max(width,height));

let blob=null;

for(let attempt=0;attempt<8;attempt++){

const canvas=document.createElement("canvas");

canvas.width=Math.max(1,Math.round(width*scale));
canvas.height=Math.max(1,Math.round(height*scale));

const ctx=canvas.getContext("2d");

ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(image,0,0,canvas.width,canvas.height);

blob=await new Promise(resolveBlob=>
canvas.toBlob(
resolveBlob,
"image/jpeg",
0.82-attempt*0.06
)
);

if(blob && blob.size<=MAX_SAVED_IMAGE_SIZE)
break;

scale*=0.82;

}

URL.revokeObjectURL(objectUrl);

if(!blob)
return reject(new Error("Image compression failed."));

resolve(blob);

}catch(error){

URL.revokeObjectURL(objectUrl);
reject(error);

}

};

image.onerror=()=>{

URL.revokeObjectURL(objectUrl);
reject(new Error("Unable to read this image."));

};

image.src=objectUrl;

});

}

function uploadPost(){

const file=postImage.files[0];
const caption=postCaption.value.trim();

if(!file)
return alert("Please choose a picture!");

if(!file.type.startsWith("image/"))
return alert("Choose an image file.");

if(file.size>MAX_UPLOAD_SIZE)
return alert("Please choose an image smaller than 5 MB.");

const shareButton=document.querySelector(
"#uploadModal .upload-area .primary-btn"
);

shareButton.disabled=true;
shareButton.textContent="Compressing and sharing...";

compressImage(file).then(blob=>{

const reader=new FileReader();

reader.onload=e=>{

const newPost={

id:"p"+Date.now(),
userId:currentUserId,
image:e.target.result,
emoji:"",
cls:"",
caption:caption||"My little moment 🤎",
likes:0,
likedBy:[]

};

data.posts.push(newPost);

if(!saveData()){

data.posts.pop();

shareButton.disabled=false;
shareButton.textContent="Share Post";

return;

}

shareButton.disabled=false;
shareButton.textContent="Share Post";

closeModal("uploadModal");
showMyProfile();

};

reader.onerror=()=>{

shareButton.disabled=false;
shareButton.textContent="Share Post";

alert("Unable to process this image. Please try another one.");

};

reader.readAsDataURL(blob);

}).catch(error=>{

shareButton.disabled=false;
shareButton.textContent="Share Post";

alert(error.message||"Unable to upload this image. Please try another one.");

});

}

// SEARCH

function searchUsers(){

const q=searchInput.value.trim().toLowerCase();

searchResults.innerHTML="";

if(!q){
searchResults.classList.add("hidden");
return;
}

searchResults.classList.remove("hidden");

const matches=data.users.filter(u=>
u.username.toLowerCase().includes(q)||
u.name.toLowerCase().includes(q)
);

if(!matches.length){
searchResults.textContent="No users found.";
return;
}

matches.forEach(u=>{

const row=document.createElement("div");
row.className="person";

const img=document.createElement("img");
img.src=u.avatar;

const info=document.createElement("div");
info.className="person-info";

info.innerHTML=`
<b>${safe(u.username)}</b>
<small>${safe(u.name)}</small>
`;

row.append(img,info);
row.onclick=()=>openProfile(u.id);

searchResults.appendChild(row);

});

}

// MODALS

function closeModal(id){
$(id).classList.remove("show");
}

document.querySelectorAll(".modal").forEach(m=>
m.addEventListener("click",e=>{
if(e.target===m)
m.classList.remove("show");
})
);

// RESTORE LOGIN

const saved=localStorage.getItem("insta_logged_user");

if(saved&&getUser(saved))
loginUser(saved);

</script>
